name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install verification dependencies
        run: npm ci --ignore-scripts

      - name: Verify sync and upgrade compatibility
        env:
          DSH_ISSUE4_CATALOG_ROOT: .
        run: npm test
      - name: Verify install package contents and documentation links
        run: node scripts/check-package-contents.mjs

  publish-approved-candidate:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: v0.20.2 [publish]')
    needs: check
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      release_tag: v0.20.2
      source_ref: ${{ github.sha }}
    secrets: inherit
