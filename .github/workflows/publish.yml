name: Publish npm and GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Pin packager
        run: npm install --global npm@11.17.0 --ignore-scripts

      - name: Sanity check tag vs package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag version ($TAG) does not match package.json version ($PKG)" >&2
            exit 1
          fi

      - name: Prepare release notes and source archive
        run: |
          node scripts/release-notes.mjs
          git archive --format=zip --prefix="dsh-chatsync-${GITHUB_REF_NAME}/" --output="dsh-chatsync-${GITHUB_REF_NAME}-source.zip" HEAD

      - name: Verify sync and upgrade compatibility before publishing
        run: npm test

      - name: Pack candidate and verify local safety evidence
        run: |
          mkdir -p work/release
          npm pack --ignore-scripts --json --pack-destination work/release > work/release/pack.json
          PACKAGE="$(node -p 'JSON.parse(require("fs").readFileSync("work/release/pack.json", "utf8"))[0].filename')"
          node scripts/check-release-safety.mjs --package "work/release/$PACKAGE"
          echo "RELEASE_PACKAGE=work/release/$PACKAGE" >> "$GITHUB_ENV"
          node scripts/pack-short-name.mjs work/short-package --verify > work/release/short.json
          echo "SHORT_PACKAGE=$(node -p 'JSON.parse(require("fs").readFileSync("work/release/short.json", "utf8")).file')" >> "$GITHUB_ENV"

      - name: Publish verified package to npm
        run: |
          PKG="$(node -p 'require("./package.json").version')"
          if npm view "@dpskk2/dsh-chatsync@$PKG" version >/dev/null 2>&1; then
            npm pack "@dpskk2/dsh-chatsync@$PKG" --ignore-scripts --pack-destination /tmp
            cmp "$RELEASE_PACKAGE" "/tmp/$(basename "$RELEASE_PACKAGE")"
          else
            npm publish "$RELEASE_PACKAGE" --ignore-scripts --provenance --access public
          fi
          if npm view "chatsync@$PKG" version >/dev/null 2>&1; then
            npm pack "chatsync@$PKG" --ignore-scripts --pack-destination /tmp
            cmp "$SHORT_PACKAGE" "/tmp/$(basename "$SHORT_PACKAGE")"
          else
            npm publish "$SHORT_PACKAGE" --ignore-scripts --provenance --access public
          fi

      - name: Publish GitHub Release with source and changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          ARCHIVE="dsh-chatsync-${TAG}-source.zip"
          sha256sum "$ARCHIVE" > SHA256SUMS.txt
          (cd work/release && sha256sum "$(basename "$RELEASE_PACKAGE")") >> SHA256SUMS.txt
          (cd "$(dirname "$SHORT_PACKAGE")" && sha256sum "$(basename "$SHORT_PACKAGE")") >> SHA256SUMS.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" "$RELEASE_PACKAGE" "$SHORT_PACKAGE" SHA256SUMS.txt --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" "$ARCHIVE" "$RELEASE_PACKAGE" "$SHORT_PACKAGE" SHA256SUMS.txt --verify-tag --title "$TAG" --notes-file release-notes.md
          fi
