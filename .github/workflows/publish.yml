name: Publish to npm and GitHub Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # npm Trusted Publishing (OIDC):无需 NPM_TOKEN / 2FA,发布身份由 GitHub OIDC 提供

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sanity check tag vs package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag version ($TAG) does not match package.json version ($PKG)" >&2
            exit 1
          fi

      - name: Prepare release notes and source archive
        run: |
          node scripts/release-notes.mjs
          git archive --format=zip --prefix="dsh-chatsync-${GITHUB_REF_NAME}/" --output="dsh-chatsync-${GITHUB_REF_NAME}-source.zip" HEAD

      - name: Skip if version already on npm (idempotent)
        run: |
          PKG="$(node -p 'require("./package.json").version')"
          if npm view "@dpskk2/dsh-chatsync@${PKG}" version >/dev/null 2>&1; then
            echo "dsh-chatsync@${PKG} 已存在于 npm,跳过发布"
            echo "ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm install

      - name: Verify before publishing
        run: npm test

      - name: Publish to npm (Trusted Publishing / OIDC)
        if: env.ALREADY_PUBLISHED != 'true'
        run: npm publish --provenance

      - name: Publish GitHub Release with source and changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          ARCHIVE="dsh-chatsync-${TAG}-source.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" "$ARCHIVE" --verify-tag --title "$TAG" --notes-file release-notes.md
          fi
